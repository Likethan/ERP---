name: CampusOS CI Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Frontend & Backend Static Analysis
  # ----------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Format Check
        run: npm run format:check

      - name: Typecheck Types Package
        run: npm run typecheck --workspace=packages/types

      - name: Typecheck Next.js Web
        run: npm run typecheck --workspace=apps/web

      - name: Lint Next.js Web
        run: npm run lint --workspace=apps/web

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Lint Backend Python (Ruff)
        run: |
          pip install ruff
          ruff check apps/api

  # ----------------------------------------------------------------------------
  # 2. Dependency Security Vulnerability Audit
  # ----------------------------------------------------------------------------
  security-audit:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Node Dependency Audit
        run: npm audit --audit-level=high

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python Dependency Audit
        run: |
          pip install pip-audit
          pip-audit -r apps/api/requirements.txt || true

  # ----------------------------------------------------------------------------
  # 3. Backend Test Suite & Migration Check
  # ----------------------------------------------------------------------------
  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campusos_user
          POSTGRES_PASSWORD: campusos_password
          POSTGRES_DB: campusos_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements-dev.txt

      - name: Verify Migration History
        run: |
          cd apps/api
          python -m alembic history

      - name: Run Backend Pytest Suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://campusos_user:campusos_password@localhost:5432/campusos_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_minimum_32_characters_for_pytest
        run: |
          cd apps/api
          pytest tests/ -v

  # ----------------------------------------------------------------------------
  # 4. Frontend Production Build Verification
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Web App
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: production
        run: npm run build --workspace=apps/web

  # ----------------------------------------------------------------------------
  # 5. Docker Production Image Build Verification
  # ----------------------------------------------------------------------------
  docker-build-verification:
    name: Docker Image Build Gates
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend API Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          tags: campusos/api:ci-test

      - name: Build Frontend Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: campusos/web:ci-test
