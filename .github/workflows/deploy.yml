name: CampusOS Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # 1. Build and Publish Production Docker Images
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.val }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute Image Tag
        id: tag
        run: echo "val=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ steps.tag.outputs.val }}
            ghcr.io/${{ github.repository }}/api:latest

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ steps.tag.outputs.val }}
            ghcr.io/${{ github.repository }}/web:latest

  # ----------------------------------------------------------------------------
  # 2. Staging Deployment & Validation
  # ----------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.campusos.internal
    steps:
      - uses: actions/checkout@v4

      - name: Execute Controlled Database Migration (Staging)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          python scripts/migrate.py run

      - name: Deploy Staging Workloads
        run: |
          echo "Deploying API and Web images (${{ needs.build-and-push.outputs.image_tag }}) to Staging..."

      - name: Staging Automated Smoke Tests
        run: |
          python scripts/smoke_test.py \
            --api-url "https://staging-api.campusos.internal" \
            --web-url "https://staging.campusos.internal"

  # ----------------------------------------------------------------------------
  # 3. Production Deployment (Manual Approval Gate Required)
  # ----------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.target_env == 'production'
    environment:
      name: production
      url: https://app.campusos.internal
    steps:
      - uses: actions/checkout@v4

      - name: Pre-Deployment Database Backup
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          python scripts/backup.py --retention 30

      - name: Execute Backward-Compatible Database Migration
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          python scripts/migrate.py run

      - name: Deploy Production Workloads (Rolling Zero-Downtime)
        run: |
          echo "Rolling out API and Web images (${{ needs.build-and-push.outputs.image_tag }}) to Production..."

      - name: Post-Deployment Smoke Tests
        run: |
          python scripts/smoke_test.py \
            --api-url "https://api.campusos.internal" \
            --web-url "https://app.campusos.internal"
